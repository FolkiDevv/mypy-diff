name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml reuse these exact checks instead of duplicating them.
  workflow_call:

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a uv release cannot change CI behaviour without a commit.
  UV_VERSION: "0.11.32"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact version, not @v9: setup-uv publishes releases past v7 but stops maintaining
        # moving major tags there, so @v9 does not resolve.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        # --locked fails the build if uv.lock has drifted from pyproject.toml.
        run: uv sync --locked --dev

      - name: ruff check
        run: uv run ruff check --output-format github

      - name: ruff format
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows failure must not hide the macOS result.
      fail-fast: false
      matrix:
        # Every OS on the baseline version, extra interpreters on the cheapest runner only.
        # Windows earns its slot: the two worst bugs so far (locale decoding of subprocess
        # output, shlex eating backslash paths) were both Windows-specific.
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7

      - name: Install jj
        uses: ./.github/actions/setup-jj

      - name: Configure git identity
        # The git fixtures set their own per-repo identity, but jj's colocated `git init` reads
        # the global config; without this it refuses to create commits.
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"

      - name: Install uv
        # Exact version, not @v9: setup-uv publishes releases past v7 but stops maintaining
        # moving major tags there, so @v9 does not resolve.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -q
